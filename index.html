<!doctype html>

<style>
:root{--bg:#0f1511;--panel:#172019;--panel2:#202b23;--text:#f1f4ef;--muted:#aeb9b0;--accent:#b8c59a;--line:#354239;--warn:#d6b38b;--ok:#a8c9ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1000px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:rgba(15,21,17,.96);backdrop-filter:blur(12px);padding:max(14px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 3px}.sub{font-size:12px;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.controls input,.controls select,input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-size:16px}textarea{min-height:110px;resize:vertical}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 16px 0}.tab,.btn{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 13px;border-radius:12px;font:inherit;cursor:pointer}.tab{border-radius:999px;padding:8px 12px}.tab.active,.btn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}.btn.ghost{background:transparent}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}main{padding:14px 16px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.card{cursor:pointer}.card:hover{border-color:var(--accent)}.n{font-size:12px;color:var(--accent);font-weight:700}.card h2,.hero h2{font-size:18px;margin:5px 0 8px}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;background:var(--panel2);border-radius:999px;padding:5px 8px;color:var(--muted)}.detail{display:none}.detail.show{display:block}.back{border:0;background:none;color:var(--accent);font-size:16px;padding:6px 0 14px}.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.exercise{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}.exercise summary{padding:14px;font-weight:700;cursor:pointer}.fields{padding:0 14px 14px}.row{border-top:1px solid var(--line);padding:10px 0}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}.value{white-space:pre-wrap;line-height:1.45}.raw{white-space:pre-wrap;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d5ddd6;background:#0c110e;padding:12px;border-radius:10px;max-height:420px;overflow:auto}.notice{font-size:12px;color:var(--muted);padding:12px 16px 0}.empty{text-align:center;color:var(--muted);padding:50px 10px}.footer{color:var(--muted);font-size:11px;text-align:center;padding:16px 20px 35px}.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}.quick .panel{padding:12px}.quick .value{font-size:14px}.report{display:grid;gap:12px}.formgrid{display:grid;gap:10px}.formgrid.two{grid-template-columns:1fr}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.hint{font-size:12px;color:var(--muted);line-height:1.45}.status{font-size:13px;color:var(--ok);min-height:20px}.report-preview{white-space:pre-wrap;background:#0c110e;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.section-title{margin:3px 0 10px;font-size:17px}@media(min-width:700px){.controls{grid-template-columns:2fr 1fr}.formgrid.two{grid-template-columns:1fr 1fr}}
</style>

<body><div class="app">
<header class="top"><h1>Skytebane rapport</h1><div class="sub">HK416 · skytetabeller · rapport og risikovurdering · PWA v5</div><div id="searchControls" class="controls"><input id="q" placeholder="Søk etter tabell eller øvelse…"><select id="level"><option value="">Alle nivåer</option><option>Grunnleggende operatør</option><option>Operatør</option><option>Videregående operatør</option><option>Videregående / mørke</option></select></div></header>
<div class="tabs"><button class="tab active" data-mode="tables">Skytetabeller</button><button class="tab" data-mode="tests">Standpunkttester</button><button class="tab" data-mode="report">Rapport</button></div>
<div class="notice">Hjelpevisning av offentlig tabellverk. Gjeldende bestemmelser, sikkerhetsregler og originaldokumentet har alltid forrang.</div>
<main><section id="list"></section><section id="detail" class="detail"></section></main>
<div class="footer">Skytebane rapport · PWA for iOS, iPadOS, Android og moderne nettlesere · utkast lagres lokalt</div></div>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s),list=$('#list'),detail=$('#detail'),q=$('#q'),lev=$('#level'),searchControls=$('#searchControls');let mode='tables';
const REPORT_KEY='hk416-report-v3';
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function plain(v=''){return String(v).replace(/\s+/g,' ').trim()}
function getReport(){try{return JSON.parse(localStorage.getItem(REPORT_KEY)||'{}')}catch{return {}}}
function saveReportObj(o){localStorage.setItem(REPORT_KEY,JSON.stringify(o))}
function render(){detail.classList.remove('show');list.style.display='block';searchControls.style.display=mode==='report'?'none':'grid';if(mode==='report'){renderReport();return}const term=q.value.toLowerCase();let items=mode==='tables'?HK_DATA.tables:HK_DATA.tests;if(mode==='tables'&&lev.value)items=items.filter(x=>x.level===lev.value);if(term)items=items.filter(x=>JSON.stringify(x).toLowerCase().includes(term));if(!items.length){list.innerHTML='<div class="empty">Ingen treff</div>';return}list.innerHTML='<div class="grid">'+items.map(x=>`<article class="card" data-id="${x.number}"><div class="n">${mode==='tables'?'TABELL':'TEST'} ${x.number}</div><h2>${esc(x.title)}</h2>${mode==='tables'?`<div class="meta"><span class="pill">${esc(x.level)}</span>${x.ammo_total!=null?`<span class="pill">${x.ammo_total} patroner totalt</span>`:''}<span class="pill">${x.exercises.length} øvelse${x.exercises.length===1?'':'r'}</span></div>`:''}</article>`).join('')+'</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(+c.dataset.id))}
function quickFields(e){const wanted=['Avstand','Målmateriell','Ammunisjon','Krav/mål','Krav'];const entries=[];for(const [k,v] of Object.entries(e.fields||{})){if(wanted.some(w=>k.toLowerCase().includes(w.toLowerCase())))entries.push([k,v])}return entries.slice(0,4)}
function reportItems(r){return Array.isArray(r.items)?r.items:[]}
function addReportItem(item){const r=getReport();r.items=reportItems(r);if(!r.items.some(x=>x.id===item.id))r.items.push(item);r.date=r.date||new Date().toISOString().slice(0,10);saveReportObj(r)}
function removeReportItem(id){const r=getReport();r.items=reportItems(r).filter(x=>x.id!==id);saveReportObj(r);renderReport()}
function setReportFromExercise(t,e){addReportItem({id:`t${t.number}-e${e.letter}`,table:t.number,tableTitle:t.title,exercise:`Øvelse ${e.letter} – ${e.title}`,label:`Tabell ${t.number} – ${t.title} / Øvelse ${e.letter} – ${e.title}`,program:Object.entries(e.fields||{}).map(([k,v])=>`${k}: ${plain(v)}`).join('\n')});flash(`Øvelse ${e.letter} er lagt til rapporten.`)}
function setReportFromTable(t){addReportItem({id:`t${t.number}-all`,table:t.number,tableTitle:t.title,exercise:'Hele tabellen',label:`Tabell ${t.number} – ${t.title} / Hele tabellen`,program:`Nivå: ${t.level}${t.ammo_total!=null?`\nAmmunisjon totalt: ${t.ammo_total} patroner`:''}`});flash(`Tabell ${t.number} er lagt til rapporten.`)}
function flash(msg){let el=document.querySelector('#flash');if(!el){el=document.createElement('div');el.id='flash';el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#b8c59a;color:#111;padding:11px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 6px 30px #0008';document.body.appendChild(el)}el.textContent=msg;el.style.display='block';clearTimeout(window.__flash);window.__flash=setTimeout(()=>el.style.display='none',1800)}
function openItem(id){const x=(mode==='tables'?HK_DATA.tables:HK_DATA.tests).find(i=>i.number===id);if(!x)return;list.style.display='none';detail.classList.add('show');if(mode==='tests'){detail.innerHTML=`<button class="back">← Tilbake</button><div class="hero"><div class="n">STANDPUNKTSTEST ${x.number}</div><h2>${esc(x.title)}</h2></div><details class="exercise" open><summary>Vis testbeskrivelse</summary><div class="fields"><div class="raw">${esc(x.raw)}</div></div></details>`}else{detail.innerHTML=`<button class="back">← Tilbake</button><div class="hero"><div class="n">TABELL ${x.number}</div><h2>${esc(x.title)}</h2><div class="meta"><span class="pill">${esc(x.level)}</span>${x.ammo_total!=null?`<span class="pill">${x.ammo_total} patroner totalt</span>`:''}</div><div class="actions"><button class="btn primary table-report">+ Legg hele tabellen til rapport</button><button class="btn open-report">Åpne rapport (${reportItems(getReport()).length})</button></div>${x.intro?`<details class="exercise"><summary>Tabelloversikt / oppsett</summary><div class="fields"><div class="raw">${esc(x.intro)}</div></div></details>`:''}</div>${x.exercises.map((e,idx)=>`<details class="exercise" ${idx===0?'open':''}><summary>Øvelse ${esc(e.letter)} · ${esc(e.title)}</summary><div class="fields"><div class="quick">${quickFields(e).map(([k,v])=>`<div class="panel"><div class="label">${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join('')}</div>${Object.entries(e.fields).map(([k,v])=>`<div class="row"><div class="label">${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join('')}<div class="actions"><button class="btn primary exercise-report" data-i="${idx}">+ Legg øvelsen til rapport</button></div><details><summary>Original tekstuttrekk</summary><div class="raw">${esc(e.raw)}</div></details></div></details>`).join('')}`;detail.querySelector('.table-report').onclick=()=>setReportFromTable(x);detail.querySelector('.open-report').onclick=()=>setMode('report');detail.querySelectorAll('.exercise-report').forEach(b=>b.onclick=()=>setReportFromExercise(x,x.exercises[+b.dataset.i]))}detail.querySelector('.back').onclick=render;scrollTo(0,0)}
function programText(r){const items=reportItems(r);return items.length?items.map((x,i)=>`${i+1}. ${x.label}\n${x.program||''}`).join('\n\n'):'Ingen tabeller/øvelser valgt.'}
function riskRows(r){const text=reportItems(r).map(x=>`${x.label} ${x.program}`).join(' ').toLowerCase();const rows=[
['Skarp ammunisjon / utilsiktet avfyring','Alvorlig personskade','Sikkerhetsregler, tydelig standplassledelse, våpenkontroll og etterlevelse av ild-/stanskommandoer.','Lav–middels'],
['Støy og trykk','Hørselsskade','Påkrevd hørselsvern og kontroll før aktivitet starter.','Lav'],
['Kulefang, rikosjett og målområde','Person- eller materiellskade','Kontroller godkjent skyteretning, kulefang, målplassering og sikkerhetsområde før skyting.','Lav–middels'],
['Uønsket person i fareområdet','Alvorlig personskade','Avsperring, kontroll på tilgang og klar kommunikasjon før ildgivning.','Lav'],
['Akutt skade / hendelse','Forsinket behandling','Førstehjelpsutstyr, kjent varslingsrutine og plan for evakuering/tilkomst for nødetater.','Lav–middels']];
if(/mørke|lykt/.test(text))rows.push(['Redusert sikt / mørke','Feil målidentifikasjon, snubling eller feil håndtering','Kontroller belysning/mørkeutrustning, tydelige grenser og ekstra kontroll før gjennomføring.','Middels']);
if(/bevegelse|vending|overgang/.test(text))rows.push(['Bevegelse under aktivitet','Fall, retningsfeil eller uønsket våpenretning','Definer bevegelsesområde, kontroller underlag og gjennomfør tydelig briefing/repetisjon før skarp aktivitet.','Middels']);
if(/vertikal støtte|barrikade|støtte/.test(text))rows.push(['Skyting nær støtte/barrikade','Rikosjett, sammenstøt eller uheldig våpenplassering','Kontroller konstruksjon, plassering og sikker våpenføring rundt støttepunktet.','Lav–middels']);
if(/makkerpar/.test(text))rows.push(['Flere skyttere i koordinert aktivitet','Kryssende sektorer eller misforståelser','Tydelig ansvarsdeling, sektorgrenser og felles stanskommando.','Middels']);
if(/nærstrid/.test(text))rows.push(['Kortere avstander','Økt konsekvens ved retningsfeil eller rikosjett','Ekstra kontroll av målområde, sikkerhetsvinkler og standplassledelse.','Middels']);
return rows}
function nbDate(v){const d=v?new Date(v+'T12:00:00'):new Date();return d.toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit',year:'numeric'})}
function riskText(r){return `RISIKOVURDERING\n\nDato: ${nbDate(r.date)}\nSted/bane: ${r.location||''}\nAvdeling/enhet: ${r.unit||''}\nAnsvarlig: ${r.instructor||''}\n\nAktiviteter:\n${reportItems(r).map((x,i)=>`${i+1}. ${x.label}`).join('\n')||'Ingen aktiviteter valgt.'}\n\nFARE | MULIG KONSEKVENS | TILTAK | RESTERENDE RISIKO\n${riskRows(r).map(x=>x.join(' | ')).join('\n')}\n\nLokale forhold / tilleggsvurdering:\n${r.risk_notes||'Ingen tillegg registrert.'}\n\nVurderingen er et støtteverktøy og må kontrolleres/godkjennes av ansvarlig person før gjennomføring.`}
function reportText(r){return `SKYTEBANELEDERS RAPPORT\nDato: ${nbDate(r.date)}\n\nSted/bane: ${r.location||''}\nAvdeling/enhet: ${r.unit||''}\nSkytebaneleder / ansvarlig: ${r.instructor||''}\n\nGJENNOMFØRTE TABELLER / ØVELSER\n${programText(r)}\n\nDELTAGELSE / RESULTAT\nAntall deltagere: ${r.participants||''}\nResultat/oppsummering:\n${r.result||''}\n\nAVVIK / MERKNADER\n${r.deviations||'Ingen registrerte.'}\n\nTILTAK / OPPFØLGING\n${r.actions||'Ingen registrerte.'}`}
function combinedText(r){return `${reportText(r)}\n\n\n========================================\nRISIKOVURDERING KNYTTET TIL AKTIVITETEN\n========================================\n\n${riskText(r)}`}
function emailBody(){return `Hei,\n\nVedlagt ligger Skytebaneleders rapport med risikovurdering for skytingen som ble gjennomført i dag.\n\nRapporten inneholder både den automatiske skyterapporten og den genererte risikovurderingen knyttet til aktiviteten.\n\nMed vennlig hilsen`}
function pdfEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[–—]/g,'-').replace(/•/g,'-').replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'a').replace(/Æ/g,'AE').replace(/Ø/g,'O').replace(/Å/g,'A')}
function wrapPdfText(text,max=92){const out=[];String(text||'').split(/\n/).forEach(par=>{if(!par){out.push('');return}let line='';par.split(/\s+/).forEach(w=>{if((line+' '+w).trim().length>max){out.push(line);line=w}else line=(line+' '+w).trim()});if(line)out.push(line)});return out}
function makePdf(title,text){const lines=[title,'',...wrapPdfText(text)];const perPage=48,pages=[];for(let i=0;i<lines.length;i+=perPage)pages.push(lines.slice(i,i+perPage));const objs=[];const add=x=>(objs.push(x),objs.length);const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');const pageIds=[],contentIds=[];pages.forEach((ls,pi)=>{let y=800,stream='BT\n/F1 11 Tf\n';ls.forEach((ln,j)=>{if(j===0){stream+='/F1 16 Tf\n';}else if(j===1){stream+='/F1 11 Tf\n'}stream+=`1 0 0 1 50 ${y} Tm (${pdfEscape(ln)}) Tj\n`;y-=15});stream+='ET';contentIds.push(add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`));pageIds.push(add('PENDING'))});const pagesId=add('PAGES_PENDING');pageIds.forEach((id,i)=>objs[id-1]=`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${contentIds[i]} 0 R >>`);objs[pagesId-1]=`<< /Type /Pages /Kids [${pageIds.map(x=>x+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;const catalog=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);let pdf='%PDF-1.4\n%âãÏÓ\n',offs=[0];objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;return new Blob([new TextEncoder().encode(pdf)],{type:'application/pdf'})}
function makeCombinedFile(r){const date=nbDate(r.date).replaceAll('.','-');return new File([makePdf(`Skytebaneleders rapport - ${nbDate(r.date)}`,combinedText(r))],`Skytebaneleders rapport ${date}.pdf`,{type:'application/pdf'})}
function downloadFile(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function renderReport(){const r=getReport();const items=reportItems(r);list.innerHTML=`<div class="report"><div class="panel"><h2 class="section-title">Rapport og risikovurdering</h2><div class="hint">Legg til én eller flere tabeller/øvelser fra Skytetabeller-fanen. Appen genererer én samlet PDF med både Skytebaneleders rapport og risikovurdering. Den kan deles fra iPhone/iPad og Android til Mail, Outlook, Gmail eller andre apper som støtter PDF-vedlegg.</div></div><div class="panel"><h2 class="section-title">Valgte aktiviteter (${items.length})</h2>${items.length?items.map(x=>`<div class="row"><div class="value"><strong>${esc(x.label)}</strong></div><button class="btn ghost remove-item" data-id="${esc(x.id)}">Fjern</button></div>`).join(''):'<div class="hint">Ingen aktiviteter er lagt til ennå.</div>'}<div class="actions"><button id="addMoreBtn" class="btn">+ Legg til flere tabeller</button></div></div><div class="panel"><div class="formgrid two"><div class="field"><label>Mottakers e-postadresse</label><input id="r_email" type="email" inputmode="email" autocomplete="email" value="${esc(r.email||'')}" placeholder="navn@domene.no"></div><div class="field"><label>Dato</label><input id="r_date" type="date" value="${esc(r.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>Sted / bane</label><input id="r_location" value="${esc(r.location||'')}"></div><div class="field"><label>Avdeling / enhet</label><input id="r_unit" value="${esc(r.unit||'')}"></div><div class="field"><label>Instruktør / ansvarlig</label><input id="r_instructor" value="${esc(r.instructor||'')}"></div><div class="field"><label>Antall deltagere</label><input id="r_participants" inputmode="numeric" value="${esc(r.participants||'')}"></div></div><div class="field" style="margin-top:10px"><label>Resultat / oppsummering</label><textarea id="r_result">${esc(r.result||'')}</textarea></div><div class="field"><label>Avvik / merknader</label><textarea id="r_deviations">${esc(r.deviations||'')}</textarea></div><div class="field"><label>Tiltak / oppfølging</label><textarea id="r_actions">${esc(r.actions||'')}</textarea></div><div class="field"><label>Lokale forhold / tillegg til risikovurderingen</label><textarea id="r_risk_notes">${esc(r.risk_notes||'')}</textarea></div><div class="actions"><button id="shareFilesBtn" class="btn primary">📎 Del Skytebaneleders rapport</button><button id="emailBtn" class="btn">✉ Åpne ferdig e-post</button><button id="downloadBtn" class="btn">Last ned PDF</button><button id="clearBtn" class="btn ghost">Tøm rapport</button></div><div id="reportStatus" class="status"></div></div><div class="panel"><h2 class="section-title">E-posttekst</h2><div class="report-preview">${esc(emailBody())}</div></div><div class="panel"><h2 class="section-title">Forhåndsvisning – Skytebaneleders rapport</h2><div id="preview" class="report-preview"></div></div><div class="panel"><h2 class="section-title">Forhåndsvisning – risikovurdering</h2><div id="riskPreview" class="report-preview"></div></div></div>`;
const ids=['email','date','location','unit','instructor','participants','result','deviations','actions','risk_notes'];function collect(){const o=getReport();ids.forEach(k=>o[k]=$('#r_'+k).value);o.items=reportItems(o);saveReportObj(o);$('#preview').textContent=reportText(o);$('#riskPreview').textContent=riskText(o);return o}ids.forEach(k=>$('#r_'+k).addEventListener('input',collect));collect();document.querySelectorAll('.remove-item').forEach(b=>b.onclick=()=>removeReportItem(b.dataset.id));$('#addMoreBtn').onclick=()=>setMode('tables');$('#emailBtn').onclick=()=>{const o=collect();if(!o.email||!/^\S+@\S+\.\S+$/.test(o.email)){status('Skriv inn en gyldig e-postadresse først.');$('#r_email').focus();return}const subject=`Skytebaneleders rapport – ${nbDate(o.date)}`;window.location.href=`mailto:${encodeURIComponent(o.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody())}`};$('#shareFilesBtn').onclick=async()=>{const o=collect(),file=makeCombinedFile(o);if(!items.length){status('Legg til minst én tabell eller øvelse først.');return}const payload={title:`Skytebaneleders rapport – ${nbDate(o.date)}`,text:emailBody(),files:[file]};if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share(payload);status('Velg ønsket e-postapp i delingsarket. PDF-filen skal følge med som vedlegg.')}catch(e){if(e.name!=='AbortError')status('Kunne ikke dele PDF direkte. Bruk «Last ned PDF» og legg den ved fra e-postappen.')}}else status('Denne nettleseren støtter ikke direkte fildeling. Bruk «Last ned PDF».')};$('#downloadBtn').onclick=()=>{const o=collect();downloadFile(makeCombinedFile(o));status('Skytebaneleders rapport med risikovurdering er opprettet som én PDF.')} ;$('#clearBtn').onclick=()=>{localStorage.removeItem(REPORT_KEY);renderReport()};function status(s){const el=$('#reportStatus');if(el)el.textContent=s}}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));lev.style.display=m==='tables'?'block':'none';render();scrollTo(0,0)}
q.oninput=render;lev.onchange=render;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js');
</script></body></html>
